    const hSum = hRoll ? hRoll.reduce((a, b) => a + b, 0) : null;
    return `<div class="dice-table">
      <div class="dim" style="font-size:13px">铜壶与龙息 · 角落的赌桌——三颗骨骰，比点数，三局两胜。当前押注 <b style="color:var(--amber-hi)">${Dice.bet} 金</b>（你有 ${St.get().player.gold} 金）</div>
      <div class="dice-vs">
        <div class="dice-side"><div class="who">你</div><div class="dice">${pRoll ? pRoll.map(d => DICE_FACE[d]).join(" ") : "· · ·"}</div><div class="sum">${pSum !== null ? pSum + " 点" : ""}</div></div>
        <div class="dice-side"><div class="who">庄家</div><div class="dice" style="color:var(--ink-dim)">${hRoll ? hRoll.map(d => DICE_FACE[d]).join(" ") : "· · ·"}</div><div class="sum">${hSum !== null ? hSum + " 点" : ""}</div></div>
      </div>
      <div class="dice-rounds">${rd}</div>
      <div class="dice-msg">${msg}</div>
      <div class="dice-bets"><span class="dim" style="font-size:13px">押注</span>${[5, 10, 20].map(b => `<button class="bet ${Dice.bet === b ? "on" : ""}" onclick="UI.dbet(${b})">${b} 金</button>`).join("")}</div>
      <div style="margin-top:8px;display:flex;justify-content:center;gap:10px">
        <button class="btn primary" id="dice-roll" ${Dice.busy || St.get().player.gold < Dice.bet ? "disabled" : ""}>掷 骰</button>
        <button class="btn" onclick="document.getElementById('modal-mask').style.display='none'">离桌</button>
      </div></div>`;
  }
  function openDice() {
    Dice.round = 0; Dice.wins = 0; Dice.loses = 0; Dice.busy = false;
    showModal(`<h3>龙骰</h3><div id="dice-box">${diceView(null, null, "坐下来的瞬间，筹码与骨骰的声响就把你围住了。玛尔塔在吧台后瞥了一眼：'输光了可别哭。'")}</div>`);
    $("dice-roll").onclick = diceRoll;
  }
  function diceRoll() {
    if (Dice.busy) return;
    const p = St.get().player;
    if (p.gold < Dice.bet) return;
    Dice.busy = true;
    // 掷骰动画：快速闪动后定格
    const box = $("dice-box");
    let ticks = 0;
    const anim = setInterval(() => {
      box.innerHTML = diceView(roll3(), roll3(), "骰子在碗里打转——");
      ticks++;
      if (ticks >= 7) {
        clearInterval(anim);
        const pr = roll3(), hr = roll3();
        const ps = pr.reduce((a, b) => a + b, 0), hs = hr.reduce((a, b) => a + b, 0);
        let msg;
        if (ps === hs) msg = ps + " 对 " + hs + "——平点，这局作废，再掷。";
        else if (ps > hs) { Dice.wins++; msg = ps + " 对 " + hs + "——这局是你的！"; }
        else { Dice.loses++; msg = ps + " 对 " + hs + "——庄家收走了这一局。"; }
        const settled = Dice.wins >= 2 || Dice.loses >= 2;
        if (settled) {
          const win = Dice.wins >= 2;
          const result = Game.diceSettle(win, Dice.bet);
          msg += (win ? " 三局两胜，桌上响起零星的喝彩。" : " 三局两负，庄家把你的注拨了过去。");
          box.innerHTML = diceView(pr, hr, msg);
          print(result); render();
          // 结算后开新一桌
          Dice.round = 0; Dice.wins = 0; Dice.loses = 0; Dice.busy = false;
          setTimeout(() => { if ($("dice-box")) { $("dice-box").innerHTML = diceView(null, null, "新一桌。手气这种东西，信则有。"); $("dice-roll").onclick = diceRoll; } }, 1800);
        } else {
          box.innerHTML = diceView(pr, hr, msg);
          Dice.busy = false;
          $("dice-roll").onclick = diceRoll;
        }
      }
    }, 90);
  }
  Object.assign(window.UI, {
    dbet: b => { Dice.bet = b; if ($("dice-box")) { $("dice-box").innerHTML = diceView(null, null, "押 " + b + " 金。掷吧。"); $("dice-roll").onclick = diceRoll; } }
  });

  /* ================= 旅人电台（预装正版曲目：Kevin MacLeod, CC BY 4.0） ================= */
  const RADIO_BASE = "https://incompetech.com/music/royalty-free/mp3-royaltyfree/";
  const RADIO_PRESET = [
    { cat: "中世纪酒馆", name: "Sweeter Vermouth",      cn: "微醺味美思" },
    { cat: "中世纪酒馆", name: "Village Consort",       cn: "乡间乐团" },
    { cat: "中世纪酒馆", name: "Suonatore di Liuto",    cn: "鲁特琴师" },
    { cat: "中世纪酒馆", name: "Folk Round",            cn: "民谣轮唱" },
    { cat: "凯尔特",     name: "Skye Cuillin",          cn: "斯凯群山" },
    { cat: "凯尔特",     name: "Celtic Impulse",        cn: "凯尔特心潮" },
    { cat: "凯尔特",     name: "Moorland",              cn: "荒野" },
    { cat: "奇幻管弦",   name: "Teller of the Tales",   cn: "说书人" },
    { cat: "奇幻管弦",   name: "Lord of the Land",      cn: "大地领主" },
    { cat: "奇幻管弦",   name: "The Pyre",              cn: "火葬堆" },
    { cat: "奇幻管弦",   name: "Frost Waltz",           cn: "霜之圆舞" },
    { cat: "奇幻管弦",   name: "Meditation Impromptu 01", cn: "冥想即兴" }
  ];
  const Radio = {
    audio: new Audio(), list: [], idx: -1, order: [], oi: 0,
    init() {
      this.audio.volume = 0.7;
      this.audio.addEventListener("ended", () => this.next());
      // 播放出错（网络中断/资源失效）→ 自动切下一首，避免卡死在"播放中"
      this.audio.addEventListener("error", () => { if (this.idx >= 0) setTimeout(() => this.next(), 1500); });
      // 看门狗：显示播放中但进度停滞约 8 秒 → 重载音源并从断点续播
      this._lastT = -1; this._stall = 0;
      setInterval(() => {
        if (this.idx < 0 || this.audio.paused || !this.audio.src) return;
        const t = this.audio.currentTime;
        if (t === this._lastT) {
          this._stall++;
          if (this._stall >= 4) {
            const pos = t, src = this.list[this.idx].src;
            this.audio.src = src;
            this.audio.addEventListener("loadedmetadata", () => {
              try { this.audio.currentTime = pos; } catch (e) {}
              this.audio.play().catch(() => {});
            }, { once: true });
            this.audio.load();
            this._stall = 0;
          }
        } else this._stall = 0;
        this._lastT = t;
      }, 2000);
      this.list = RADIO_PRESET.map(t => ({
        name: t.cn + " · " + t.name, cat: t.cat, kind: "preset",
        src: RADIO_BASE + encodeURIComponent(t.name) + ".mp3"
      }));
      let urls = [];
      try { urls = JSON.parse(localStorage.getItem("astraea_radio_urls") || "[]"); } catch (e) {}
      for (const u of urls) this.list.push({ name: u.name, cat: "自选", src: u.url, kind: "url" });
      this.shuffle();
    },
    shuffle() {
      // 洗牌：随机顺序，一轮播完重新洗
      this.order = this.list.map((_, i) => i);
      for (let i = this.order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [this.order[i], this.order[j]] = [this.order[j], this.order[i]];
      }
      this.oi = 0;
    },
    autoplay() {
      // 进游戏自动开播（需在用户点击的调用栈里，浏览器才放行声音）
      if (this.idx >= 0 || !this.list.length) return;
      this.play(this.order[0]);
    },
    saveUrls() {
      localStorage.setItem("astraea_radio_urls", JSON.stringify(this.list.filter(t => t.kind === "url").map(t => ({ name: t.name, url: t.src }))));
    },
    addUrl(url) {
      if (!url) return;
      const nm = url.split("/").pop().split("?")[0].slice(0, 40) || "在线曲目";
      this.list.push({ name: decodeURIComponent(nm), cat: "自选", src: url, kind: "url" });
      this.saveUrls();
    },
    remove(i) {
      const t = this.list[i];
      if (!t || t.kind !== "url") return; // 预装曲目常驻
      this.list.splice(i, 1);
      this.saveUrls();
      if (this.idx === i) { this.audio.pause(); this.idx = -1; }
      else if (this.idx > i) this.idx--;
    },
    play(i) {
      if (i < 0 || i >= this.list.length) return;
      this.idx = i;
      this.audio.src = this.list[i].src;
      this.audio.play().catch(() => {});
      this.updateNowPlaying();
    },
    toggle() {
      if (this.idx < 0) { if (this.list.length) this.play(this.order[0]); return; }
      if (this.audio.paused) this.audio.play().catch(() => {}); else this.audio.pause();
      this.updateNowPlaying();
    },
    next() {
      if (!this.list.length) return;
      this.oi++;
      if (this.oi >= this.order.length) this.shuffle();
      this.play(this.order[this.oi]);
    },
    setVolume(v) { this.audio.volume = v; },
    nowText() {
      return (this.idx >= 0 && !this.audio.paused) ? "♪ " + this.list[this.idx].name : "";
    },
    updateNowPlaying() {
      const t = this.nowText();
      $("now-playing").style.display = t ? "" : "none";
      $("now-playing").textContent = t;
    }
  };
  Radio.init();

  function openRadio() {
    let lastCat = "";
    const rows = Radio.list.map((t, i) => {
      const head = t.cat !== lastCat ? `<h4>${t.cat}</h4>` : "";
      lastCat = t.cat;
      return head + `<div class="item-row"><span>${Radio.idx === i ? "▶ " : ""}${t.name}</span>
      <span class="ops"><button onclick="UI.rplay(${i})">${Radio.idx === i && !Radio.audio.paused ? "播放中" : "播放"}</button>${t.kind === "url" ? `<button onclick="UI.rdel(${i})">移除</button>` : ""}</span></div>`;
    }).join("");
    showModal(`<h3>旅人电台</h3>
      <div class="radio-now">${Radio.nowText() || "壁炉边还安静着。点一首，旅途就开始了。"}</div>
      <div class="radio-row">
        <button class="btn" onclick="UI.rtoggle()">播放 / 暂停</button>
        <button class="btn" onclick="UI.rnext()">下一首</button>
        <span class="dim">音量</span><input type="range" id="radio-vol" min="0" max="1" step="0.05" value="${Radio.audio.volume}" style="width:120px">
      </div>
      ${rows}
      <div class="radio-row" style="margin-top:12px">
        <input id="radio-url" placeholder="有自己的收藏？粘贴 mp3 直链加入" style="flex:1">
        <button class="btn" id="radio-add-url">添加</button>
      </div>
      <div class="dim" style="margin-top:6px">曲目：Kevin MacLeod（incompetech.com），CC BY 4.0 授权，在线播放。进游戏自动随机开播，播完按随机顺序切下一首，顶栏显示当前曲目。</div>`);
    $("radio-vol").oninput = e => Radio.setVolume(parseFloat(e.target.value));
    $("radio-add-url").onclick = () => { Radio.addUrl($("radio-url").value.trim()); openRadio(); };
  }
  Object.assign(window.UI, {
    rplay: i => { Radio.play(i); openRadio(); },
    rdel: i => { Radio.remove(i); openRadio(); Radio.updateNowPlaying(); },
    rtoggle: () => { Radio.toggle(); openRadio(); },
    rnext: () => { Radio.next(); openRadio(); }
  });

  render();
})();
</script>
</body>
</html>
