<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" id="vp">
<script>
/* 手机访问：锁定 1280px 桌面渲染宽度，整体缩放，比例与电脑版一致 */
(function () {
  try {
    var coarse = window.matchMedia && matchMedia("(pointer: coarse)").matches;
    var small = Math.min(window.screen.width || 9999, window.screen.height || 9999) < 700;
    if (coarse && small) {
      document.getElementById("vp").setAttribute("content", "width=1280");
      document.documentElement.classList.add("phone-fit");
    }
  } catch (e) {}
})();
</script>
<title>魔导纪元 · Astraea</title>
<style>
  :root {
    --bg: #100c08; --bg2: #1a1410; --panel: #221a12; --panel2: #2a2016;
    --line: #4a3823; --line-hi: #6b5232;
    --ink: #ead9b8; --ink-dim: #b09b74; --amber: #e0aa45; --amber-hi: #f5c96b;
    --red: #c8523c; --green: #86a95c; --blue: #5f87b0;
    --kai: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "Noto Serif SC", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; height: 100vh; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-track { background: #171009; }
  ::-webkit-scrollbar-thumb { background: var(--line); border: 2px solid #171009; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-hi); }

  /* ================= 标题界面 ================= */
  #title-screen {
    height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background:
      linear-gradient(to bottom, rgba(16,12,8,.45) 0%, rgba(16,12,8,.15) 40%, rgba(16,12,8,.88) 100%),
      url("assets/title-bg.png") center 30% / cover no-repeat;
    position: relative;
  }
  #title-screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 180px 60px rgba(0,0,0,.75); }
  #title-screen h1 {
    font-family: var(--kai); font-size: 72px; letter-spacing: 26px; color: var(--amber-hi); text-indent: 26px;
    text-shadow: 0 0 46px rgba(224,170,69,.6), 0 4px 18px rgba(0,0,0,.9), 0 2px 4px #000;
    z-index: 1; font-weight: 700;
  }
  #title-screen .sub { color: var(--ink); letter-spacing: 5px; z-index: 1; text-shadow: 0 2px 8px #000; font-size: 15px; }
  #title-screen .quote { font-family: var(--kai); color: var(--ink-dim); z-index: 1; text-shadow: 0 2px 6px #000; margin-top: 4px; font-size: 16px; letter-spacing: 3px; }
  #title-screen .menu { z-index: 1; display: flex; flex-direction: column; gap: 12px; margin-top: 26px; width: 300px; }
  .title-btn {
    background: linear-gradient(to bottom, rgba(42,32,22,.92), rgba(26,20,16,.92));
    border: 1px solid var(--line-hi); color: var(--ink); padding: 13px 0; font-size: 18px; letter-spacing: 8px; text-indent: 8px;
    position: relative; transition: all .2s; box-shadow: 0 4px 14px rgba(0,0,0,.6); font-family: var(--kai);
  }
  .title-btn::before, .title-btn::after { content: ""; position: absolute; width: 7px; height: 7px; border: 1px solid var(--line-hi); transform: rotate(45deg); background: var(--bg2); }
  .title-btn::before { left: -4px; top: -4px; } .title-btn::after { right: -4px; bottom: -4px; }
  .title-btn:hover { border-color: var(--amber); color: var(--amber-hi); box-shadow: 0 0 22px rgba(224,170,69,.35); }
  .title-btn.primary { border-color: var(--amber); color: var(--amber-hi); }
  #title-screen .foot { position: absolute; bottom: 18px; color: rgba(176,155,116,.55); font-size: 12px; letter-spacing: 2px; z-index: 1; }
  #title-screen .author { position: absolute; right: 28px; bottom: 24px; color: var(--amber-hi); font-family: var(--kai); font-size: 28px; letter-spacing: 6px; z-index: 1; text-shadow: 0 0 18px rgba(224,170,69,.55), 0 2px 6px #000; }

  /* ================= 全局背景画 ================= */
  #bg-art {
    position: fixed; inset: -24px; z-index: 0; pointer-events: none; display: none;
    background: url("assets/title-bg.png") center 25% / cover no-repeat;
    filter: blur(7px) brightness(.30) saturate(.85);
  }
  #game { position: relative; z-index: 1; }

  /* ================= 通用按钮 ================= */
  .btn {
    background: linear-gradient(to bottom, var(--panel2), var(--panel));
    border: 1px solid var(--line); color: var(--ink); padding: 8px 16px; font-size: 14px;
    transition: all .15s; letter-spacing: 1px;
    box-shadow: inset 0 1px 0 rgba(234,217,184,.10), 0 2px 6px rgba(0,0,0,.45);
  }
  .btn:hover { border-color: var(--amber); color: var(--amber-hi); box-shadow: 0 0 12px rgba(224,170,69,.25); }
  .btn.primary { border-color: var(--amber); color: var(--amber-hi); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.exhausted, .btn.exhausted:hover {
    background: #17120c; color: #6e6252; border-color: #33291d;
    box-shadow: none; cursor: not-allowed; opacity: .85;
  }

  /* ================= 主界面 ================= */
  #game { display: none; height: 100vh; grid-template-rows: 42px 1fr auto; grid-template-columns: 264px 1fr; }
  #topbar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 4px; padding: 0 12px;
    background: linear-gradient(to bottom, rgba(24,17,10,.92), rgba(18,13,8,.88));
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(107,82,50,.6); box-shadow: 0 1px 14px rgba(0,0,0,.55); font-size: 14px; z-index: 6;
  }
  #topbar .brand { font-family: var(--kai); color: var(--amber); font-size: 16px; letter-spacing: 4px; text-shadow: 0 0 10px rgba(224,170,69,.35); margin-right: 8px; }
  #topbar .spacer { flex: 1; }
  #topbar button { background: none; border: 1px solid transparent; color: var(--ink-dim); padding: 5px 10px; font-size: 13px; letter-spacing: 1px; transition: all .15s; }
  #topbar button:hover { color: var(--amber-hi); border-color: rgba(224,170,69,.4); box-shadow: 0 0 10px rgba(224,170,69,.15); }
  #now-playing { color: var(--green); font-size: 12px; letter-spacing: 1px; display: none; animation: pulse 2.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: .65; } 50% { opacity: 1; } }

  /* ============ 侧栏 · 角色卡 ============ */
  #sidebar {
    background: linear-gradient(to bottom, rgba(22,16,10,.88), rgba(16,11,6,.86));
    backdrop-filter: blur(6px);
    border-right: 1px solid rgba(107,82,50,.55); padding: 16px 14px 20px; overflow-y: auto; font-size: 14px;
    position: relative; z-index: 5;
  }
  .portrait { width: 92px; height: 92px; margin: 2px auto 12px; position: relative; }
  .portrait .diamond {
    position: absolute; inset: 8px; transform: rotate(45deg);
    border: 2px solid var(--line-hi); background: radial-gradient(circle at 40% 35%, #332413, #171009 78%);
    box-shadow: 0 0 18px rgba(224,170,69,.22), inset 0 0 16px rgba(0,0,0,.7);
  }
  .portrait .diamond::after { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(224,170,69,.28); }
  .portrait span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--kai); font-size: 40px; color: var(--amber-hi); text-shadow: 0 0 16px rgba(224,170,69,.55);
  }
  .side-name { font-family: var(--kai); font-size: 20px; color: var(--amber-hi); letter-spacing: 3px; }
  .side-lv { color: var(--ink-dim); font-size: 13px; margin-top: 2px; }
  .orb-row { display: flex; gap: 14px; justify-content: center; margin: 12px 0 6px; }
  .orb { width: 74px; height: 74px; border-radius: 50%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid var(--line-hi); box-shadow: inset 0 0 18px rgba(0,0,0,.7), 0 0 14px rgba(0,0,0,.5); }
  .orb.hp { background: radial-gradient(circle at 35% 30%, #8a4030, #3d140c 75%); }
  .orb.mp { background: radial-gradient(circle at 35% 30%, #35536e, #101d2e 75%); }
  .orb .v { font-size: 15px; font-weight: 700; text-shadow: 0 1px 3px #000; }
  .orb .k { font-size: 11px; color: rgba(234,217,184,.75); letter-spacing: 2px; }
  .mini-bars { margin-top: 10px; }
  .bar { height: 9px; background: #0a0704; border: 1px solid var(--line); margin: 3px 0 7px; box-shadow: inset 0 1px 3px #000; }
  .bar > div { height: 100%; transition: width .35s; }
  .bar.sup > div { background: linear-gradient(to right, #5c7a3e, #86a95c); }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); letter-spacing: 1px; }
  .stat-row { display: flex; justify-content: space-between; margin: 4px 0; }
  .gold-v { color: var(--amber-hi); }
  .side-sec { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 9px; }
  .side-sec h4 { color: var(--amber); font-size: 12px; letter-spacing: 4px; margin-bottom: 6px; text-align: center; position: relative; }
  .side-sec h4::before, .side-sec h4::after { content: ""; position: absolute; top: 50%; width: 22%; height: 1px; background: var(--line); }
  .side-sec h4::before { left: 0; } .side-sec h4::after { right: 0; }
  .skill-line { color: var(--ink-dim); font-size: 13px; line-height: 1.7; }
  .skill-line.un { color: var(--ink); }

  /* ============ 主舞台：场景画铺满整个叙事区，画就是世界 ============ */
  #main { position: relative; overflow: hidden; background: #0a0705; }
  #scene-img {
    position: absolute; inset: -3%; width: 106%; height: 106%; object-fit: cover; object-position: center 40%;
    filter: saturate(.96) brightness(.88);
    transition: opacity .9s ease;
    animation: kenburns 42s ease-in-out infinite alternate;
  }
  @keyframes kenburns { from { transform: scale(1.0) translate(0, 0); } to { transform: scale(1.07) translate(-1.4%, -1.8%); } }
  .atmo { position: absolute; inset: 0; pointer-events: none; transition: opacity .8s ease, background .8s ease; }
  #atmo-vig { background: radial-gradient(ellipse at 50% 42%, transparent 46%, rgba(5,3,1,.52) 100%); z-index: 3; }
  /* 时段光影 */
  #atmo-time { z-index: 1; }
  #main.seg-0 #atmo-time { background: linear-gradient(to bottom, rgba(190,200,225,.10), rgba(90,80,60,.06) 55%, rgba(30,22,12,.18)); }
  #main.seg-2 #atmo-time { background: linear-gradient(to bottom, rgba(220,120,40,.16), rgba(140,60,20,.10) 55%, rgba(40,16,6,.26)); }
  #main.seg-3 #atmo-time { background: linear-gradient(to bottom, rgba(10,16,48,.42), rgba(6,10,30,.38) 55%, rgba(2,4,14,.55)); }
  /* 天气 */
  #atmo-weather { z-index: 2; opacity: 0; overflow: hidden; }
  #main.w-rain #atmo-weather {
    opacity: .55;
    background-image: repeating-linear-gradient(112deg, rgba(170,190,215,.13) 0 1px, transparent 1px 9px);
    background-size: 200px 200px; animation: rain-fall .5s linear infinite;
  }
  @keyframes rain-fall { to { background-position: -60px 200px; } }
  #main.w-fog #atmo-weather { opacity: 1; }
  #main.w-fog #atmo-weather::before, #main.w-fog #atmo-weather::after {
    content: ""; position: absolute; width: 130%; height: 70%; left: -15%;
    background: radial-gradient(ellipse at center, rgba(200,205,210,.20), transparent 68%);
    filter: blur(14px);
  }
  #main.w-fog #atmo-weather::before { top: 6%; animation: fog-drift 26s ease-in-out infinite alternate; }
  #main.w-fog #atmo-weather::after { bottom: 8%; animation: fog-drift 34s ease-in-out infinite alternate-reverse; }
  @keyframes fog-drift { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
  #main.w-cold #atmo-weather { opacity: 1; background: rgba(110,145,190,.13); backdrop-filter: saturate(.72) brightness(.96); }
  /* 战斗压迫感：血色暗角脉冲 */
  #atmo-combat { z-index: 4; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 48%, rgba(148,22,10,.46) 100%); }
  #main.in-combat #atmo-combat { opacity: 1; animation: combat-pulse 1.7s ease-in-out infinite; }
  @keyframes combat-pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  #main.in-combat #scene-img { filter: saturate(.82) brightness(.78) contrast(1.05); }

  /* 地点牌匾（巫师式：到一地，亮一名） */
  #scene-bar {
    position: absolute; top: 20px; left: 24px; z-index: 5;
    display: flex; flex-direction: column; gap: 2px;
    background: linear-gradient(to right, rgba(16,11,6,.85), rgba(16,11,6,.55));
    border: 1px solid rgba(107,82,50,.55); border-left: 3px solid var(--amber);
    padding: 9px 22px 8px 14px; backdrop-filter: blur(5px);
    box-shadow: 0 4px 18px rgba(0,0,0,.5);
    animation: plaque-in .8s ease both;
  }
  @keyframes plaque-in { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  #scene-title { font-family: var(--kai); font-size: 24px; color: var(--amber-hi); letter-spacing: 7px; text-shadow: 0 0 16px rgba(224,170,69,.4), 0 2px 4px #000; }
  #scene-sub { color: var(--ink-dim); font-size: 12.5px; letter-spacing: 2px; text-shadow: 0 1px 3px #000; }

  /* ============ 装备槽 ============ */
  .eq-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; color: var(--ink-dim); }
  .eq-row .slot-ic { color: var(--amber); display: inline-flex; }
  .eq-row .eq-name { color: var(--ink); flex: 1; }
  .eq-row .eq-none { flex: 1; font-style: italic; opacity: .55; }
  .eq-row button { background: none; border: 1px solid var(--line); color: var(--ink-dim); font-size: 11px; padding: 1px 7px; }
  .eq-row button:hover { border-color: var(--amber); color: var(--amber-hi); }
  .eq-stat { color: var(--green); font-size: 12px; }

  /* ============ 魔物图鉴卡 ============ */
  .best-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .best-card { border: 1px solid var(--line); background: linear-gradient(to bottom, var(--panel2), var(--panel)); padding: 10px 12px; }
  .best-card .bn { font-family: var(--kai); color: var(--amber-hi); font-size: 17px; letter-spacing: 2px; }
  .best-card .bs { display: flex; gap: 12px; font-size: 12px; color: var(--ink-dim); margin: 3px 0 5px; flex-wrap: wrap; }
  .best-card .bs b { color: var(--ink); font-weight: normal; }
  .best-card .bl { font-size: 13px; color: var(--ink-dim); line-height: 1.65; }
  .best-card .bd { font-size: 12px; margin-top: 5px; color: var(--green); }

  /* ============ 龙骰 ============ */
  .dice-table { text-align: center; padding: 6px 0 2px; }
  .dice-vs { display: flex; justify-content: space-around; margin: 12px 0; }
  .dice-side { flex: 1; }
  .dice-side .who { font-size: 13px; color: var(--ink-dim); letter-spacing: 3px; margin-bottom: 6px; }
  .dice-side .dice { font-size: 44px; letter-spacing: 6px; line-height: 1.2; color: var(--amber-hi); text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  .dice-side .sum { margin-top: 4px; font-size: 14px; color: var(--ink); }
  .dice-rounds { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
  .dice-rounds .rd { width: 14px; height: 14px; border: 1px solid var(--line-hi); transform: rotate(45deg); background: var(--bg2); }
  .dice-rounds .rd.win { background: var(--amber); border-color: var(--amber-hi); box-shadow: 0 0 8px rgba(224,170,69,.6); }
  .dice-rounds .rd.lose { background: #4a2c22; border-color: var(--red); }
  .dice-msg { min-height: 26px; font-family: var(--kai); font-size: 16px; color: var(--ink); margin: 6px 0; }
  .dice-bets { display: flex; justify-content: center; gap: 8px; margin: 8px 0 4px; align-items: center; }
  .dice-bets .bet { border: 1px solid var(--line); background: var(--panel); color: var(--ink-dim); padding: 4px 14px; font-size: 14px; }
  .dice-bets .bet.on { border-color: var(--amber); color: var(--amber-hi); box-shadow: 0 0 10px rgba(224,170,69,.25); }

  /* ============ 锻造 ============ */
  .craft-card { border: 1px solid var(--line); background: linear-gradient(to bottom, var(--panel2), var(--panel)); padding: 10px 13px; margin-bottom: 9px; }
  .craft-card .cn { font-family: var(--kai); font-size: 17px; color: var(--amber-hi); letter-spacing: 2px; }
  .craft-card .cs { font-size: 12px; color: var(--green); margin-left: 8px; }
  .craft-card .cm { font-size: 13px; margin: 5px 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .craft-card .cm .ok { color: var(--green); }
  .craft-card .cm .lack { color: var(--red); }
  .craft-card .cd { font-size: 12px; color: var(--ink-dim); }

  /* ============ 叙事窗：浮在画卷上的故事书 ============ */
  #log {
    position: absolute; left: 0; right: 0; bottom: 0; height: 47%; z-index: 5;
    overflow-y: auto; padding: 46px 40px 24px;
    font-family: var(--kai); line-height: 2.05; font-size: 20px; letter-spacing: 1px;
    background: linear-gradient(to top, rgba(8,5,3,.95) 0%, rgba(8,5,3,.91) 52%, rgba(8,5,3,.68) 78%, rgba(8,5,3,0) 100%);
    backdrop-filter: blur(2.5px);
    scrollbar-width: thin;
  }
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log-inner { max-width: 800px; margin: 0 auto; white-space: pre-wrap; }
  #log .entry {
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 26px rgba(0,0,0,.6);
    animation: entry-in .5s ease both;
  }
  @keyframes entry-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
  #log .entry.combat { border-left: 2px solid rgba(200,82,60,.85); padding-left: 13px; }
  #log .entry.combat::first-line { color: #e8b7a8; }
  #log .sys { color: var(--amber); font-size: 17px; }
  #log .player-input { color: #8fb4d8; font-size: 17px; opacity: .95; }
  #log .divider { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
  #log .divider::before, #log .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--line), transparent); }
  #log .divider span { display: inline-block; width: 8px; height: 8px; border: 1px solid var(--line-hi); transform: rotate(45deg); }

  /* 名词词条 */
  .lex { color: var(--amber-hi); border-bottom: 1px dashed rgba(224,170,69,.55); cursor: pointer; padding: 0 1px; transition: all .12s; }
  .lex:hover { background: rgba(224,170,69,.18); text-shadow: 0 0 8px rgba(224,170,69,.5); }
  .lex-type { display: inline-block; border: 1px solid var(--amber); color: var(--amber); font-size: 12px; padding: 1px 8px; letter-spacing: 2px; margin-bottom: 10px; }

  /* 剧情选项按钮 */
  #log .choices { display: flex; flex-direction: column; gap: 7px; margin: 12px 0 4px; }
  #log .choices::before { content: "—— 你的抉择 ——"; text-align: center; font-size: 12px; letter-spacing: 4px; color: var(--ink-dim); }
  #log .choice-btn {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: linear-gradient(to bottom, rgba(46,34,22,.88), rgba(28,21,15,.88));
    border: 1px dashed rgba(224,170,69,.55); color: var(--ink);
    padding: 10px 15px; font-size: 16.5px; font-family: var(--kai); letter-spacing: 1px;
    transition: all .15s; box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  #log .choice-btn svg { flex: 0 0 auto; color: var(--amber); }
  #log .choice-btn:hover { border-style: solid; border-color: var(--amber-hi); color: var(--amber-hi); box-shadow: 0 0 14px rgba(224,170,69,.3); transform: translateX(5px); }
  #log .choices.stale { opacity: .32; }
  #log .choices.stale .choice-btn { cursor: default; transform: none; border-style: dashed; box-shadow: none; }

  /* ============ 动作坞：快捷栏式 ============ */
  #actions {
    grid-column: 1 / -1;
    background: linear-gradient(to top, rgba(20,14,8,.94), rgba(15,11,6,.90));
    backdrop-filter: blur(8px);
    border-top: 1px solid rgba(107,82,50,.55); padding: 10px 20px 12px; display: flex; flex-direction: column; gap: 9px;
    max-height: 178px; overflow-y: auto; box-shadow: 0 -3px 18px rgba(0,0,0,.55);
    position: relative; z-index: 6;
  }
  #action-dock { display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: flex-start; }
  .act-group { display: flex; flex-direction: column; gap: 6px; }
  .ag-label { font-size: 10.5px; letter-spacing: 4px; color: var(--ink-dim); opacity: .85; text-transform: uppercase; }
  .g-combat .ag-label { color: var(--red); }
  .g-quest .ag-label { color: var(--amber); }
  .ag-btns { display: flex; flex-wrap: wrap; gap: 7px; max-width: 580px; }
  .act-btn {
    min-height: 38px; padding: 7px 15px; font-size: 14px; letter-spacing: 1.5px;
    background: linear-gradient(to bottom, rgba(52,39,24,.9), rgba(32,23,14,.9));
    border: 1px solid rgba(107,82,50,.65);
    box-shadow: inset 0 1px 0 rgba(234,217,184,.08), 0 2px 7px rgba(0,0,0,.5);
  }
  .act-btn:hover { transform: translateY(-1px); border-color: var(--amber); box-shadow: 0 0 14px rgba(224,170,69,.3), 0 3px 9px rgba(0,0,0,.55); }
  .g-combat .act-btn { border-color: rgba(160,70,50,.6); }

  #input-row { display: flex; gap: 9px; }

  }

  /* ================= 弹层 ================= */
  .modal-mask { position: fixed; inset: 0; background: rgba(5,3,1,.78); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: linear-gradient(to bottom, #261c11, #1d150d); border: 1px solid var(--line-hi); width: 660px; max-width: 94vw; max-height: 88vh; overflow-y: auto; padding: 22px 26px 26px; box-shadow: 0 0 60px rgba(0,0,0,.8), inset 0 0 40px rgba(0,0,0,.35); position: relative; }
  .modal.wide { width: 1160px; max-width: 97vw; }
  .modal::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(74,56,35,.5); pointer-events: none; }
  .modal h3 { font-family: var(--kai); color: var(--amber-hi); letter-spacing: 5px; margin-bottom: 14px; text-align: center; font-size: 21px; text-shadow: 0 0 14px rgba(224,170,69,.35); display: flex; align-items: center; gap: 14px; justify-content: center; }
  .modal h3::before, .modal h3::after { content: ""; height: 1px; flex: 0 0 56px; background: linear-gradient(to right, transparent, var(--line-hi)); }
  .modal h3::after { background: linear-gradient(to left, transparent, var(--line-hi)); }
  .modal h4 { color: var(--amber); letter-spacing: 2px; margin: 14px 0 8px; font-size: 14px; }
  .modal .close { position: absolute; top: 10px; right: 14px; background: none; border: none; color: var(--ink-dim); font-size: 19px; z-index: 2; }
  .modal .close:hover { color: var(--amber-hi); }
  .modal .lex-body { font-family: var(--kai); font-size: 16.5px; line-height: 2; }
  .item-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px solid rgba(74,56,35,.45); font-size: 14px; }
  .item-row .ops { white-space: nowrap; }
  .item-row .ops button { margin-left: 6px; background: none; border: 1px solid var(--line); color: var(--ink-dim); padding: 3px 9px; font-size: 12px; }
  .item-row .ops button:hover { color: var(--amber-hi); border-color: var(--amber); }
  .dim { color: var(--ink-dim); font-size: 13px; }
  .quest-rank { color: var(--amber); }
  .settings-row { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-size: 14px; }
  .settings-row input, .settings-row select { flex: 1; background: #120d07; border: 1px solid var(--line); color: var(--ink); padding: 7px 10px; font-family: inherit; }

  /* 魔导书选择 */
  .g-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 12px 0; }
  .g-card { border: 1px solid var(--line); padding: 10px 12px; cursor: pointer; background: #171009; transition: all .15s; }
  .g-card:hover { border-color: var(--line-hi); }
  .g-card.sel { border-color: var(--amber); box-shadow: 0 0 14px rgba(224,170,69,.35); background: #20160b; }
  .g-card .gn { color: var(--amber-hi); font-size: 15px; }
  .g-card .gd { color: var(--ink-dim); font-size: 12px; margin-top: 3px; line-height: 1.6; }

  /* 地图 */
  .map-wrap { position: relative; border: 1px solid var(--line-hi); box-shadow: 0 0 30px rgba(0,0,0,.6); }
  .map-wrap img { display: block; width: 100%; }
  .map-marker { position: absolute; transform: translate(-50%, -100%); cursor: pointer; text-align: center; z-index: 2; }
  .map-marker .pin { width: 14px; height: 14px; margin: 0 auto 2px; transform: rotate(45deg); border: 2px solid var(--amber); background: rgba(224,170,69,.85); box-shadow: 0 0 10px rgba(224,170,69,.8); }
  .map-marker .nm { font-size: 15px; color: #fff8e8; text-shadow: 0 1px 3px #000, 0 0 8px #000; letter-spacing: 1px; white-space: nowrap; background: rgba(16,12,8,.55); padding: 1px 7px; }
  .map-marker.locked .pin { border-color: #6e6252; background: rgba(110,98,82,.6); box-shadow: none; }
  .map-marker.locked .nm { color: #b7ac99; }
  .map-marker.here .nm { color: var(--amber-hi); border: 1px solid var(--amber); }
  #map-info { margin-top: 10px; font-size: 14px; line-height: 1.9; min-height: 44px; }

  /* 当前目标指引框 */
  #ui-guide-box { margin-top: 12px; border: 1px solid rgba(224,170,69,.5); background: linear-gradient(135deg, rgba(224,170,69,.10), rgba(224,170,69,.03)); padding: 10px 12px; box-shadow: 0 0 16px rgba(224,170,69,.12), inset 0 0 20px rgba(0,0,0,.3); }
  #ui-guide-box .gh { font-size: 11px; color: var(--amber); letter-spacing: 3px; margin-bottom: 5px; }
  #ui-guide-box .gt { color: var(--amber-hi); font-size: 14px; letter-spacing: 1px; }
  #ui-guide-box .gtag { display: inline-block; font-size: 11px; border: 1px solid var(--amber); color: var(--amber); padding: 0 6px; margin-right: 6px; letter-spacing: 1px; }
  #ui-guide-box .gx { color: var(--ink-dim); font-size: 12.5px; line-height: 1.75; margin-top: 5px; }
  /* 委托分区 */
  .quest-sec { color: var(--amber); letter-spacing: 3px; font-size: 13px; margin: 14px 0 6px; border-left: 3px solid var(--amber); padding-left: 8px; }
  .quest-sec.side { border-color: var(--blue); color: var(--ink-dim); }
  .quest-sec.board { border-color: var(--line-hi); color: var(--ink-dim); }
  .quest-main-badge { color: var(--amber-hi); border: 1px solid var(--amber); padding: 0 5px; font-size: 12px; }

  /* 图标 */
  #topbar button { display: inline-flex; align-items: center; gap: 6px; }
  #topbar button svg { flex: 0 0 auto; }
  .bar-label span:first-child, .stat-row span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .bar-label svg, .stat-row svg { vertical-align: -2px; }
  .ag-label { display: inline-flex; align-items: center; gap: 5px; }
  .act-btn { display: inline-flex; align-items: center; gap: 5px; }
  .itm-ic { vertical-align: -2px; margin-right: 2px; }

  /* 区域小地图标记 */
  .mm-marker { position: absolute; transform: translate(-50%, -100%); cursor: pointer; text-align: center; z-index: 2; }
  .mm-marker .badge { width: 32px; height: 32px; border-radius: 50%; margin: 0 auto 3px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 30%, #3a2b18, #1c130a); border: 2px solid var(--amber); color: var(--amber-hi); box-shadow: 0 0 12px rgba(224,170,69,.55); }
  .mm-marker .nm { font-size: 13.5px; color: #fff8e8; text-shadow: 0 1px 3px #000, 0 0 8px #000; letter-spacing: 1px; white-space: nowrap; background: rgba(16,12,8,.62); padding: 1px 7px; }
  .mm-marker .fn { display: inline-block; font-size: 11.5px; color: var(--amber-hi); text-shadow: 0 1px 3px #000, 0 0 6px #000; white-space: nowrap; background: rgba(16,12,8,.48); padding: 0 6px; margin-top: 1px; letter-spacing: .5px; }
  .mm-marker.spot .badge { width: 25px; height: 25px; border-color: var(--line-hi); box-shadow: 0 0 8px rgba(0,0,0,.6); }
  .mm-marker.spot .nm { font-size: 12px; }
  .mm-marker.spot .fn { font-size: 11px; }
  .mm-marker.here .badge { border-color: #fff2d8; box-shadow: 0 0 16px rgba(245,201,107,.9); }
  .mm-marker:hover .badge { border-color: var(--amber-hi); box-shadow: 0 0 16px rgba(224,170,69,.85); }

  /* 世界观 / 人物卡 通用页签 */
  .lore-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; justify-content: center; }
  .lore-tabs button { background: #171009; border: 1px solid var(--line); color: var(--ink-dim); padding: 7px 14px; font-size: 13.5px; letter-spacing: 2px; display: inline-flex; gap: 6px; align-items: center; transition: all .15s; }
  .lore-tabs button:hover { border-color: var(--line-hi); color: var(--ink); }
  .lore-tabs button.on { border-color: var(--amber); color: var(--amber-hi); box-shadow: 0 0 12px rgba(224,170,69,.25); }
  .lore-body { font-family: var(--kai); font-size: 16px; line-height: 2; }
  .lore-body p { margin: 8px 0; }
  .lore-quote { border-left: 3px solid var(--amber); padding: 8px 14px; margin: 12px 0; background: rgba(224,170,69,.06); color: var(--ink); }
  .lore-tl { margin: 12px 0 6px 16px; padding-left: 26px; border-left: 1px solid var(--line-hi); }
  .lore-tl .ev { position: relative; margin-bottom: 18px; }
  .lore-tl .ev::before { content: ""; position: absolute; left: -31px; top: 8px; width: 9px; height: 9px; transform: rotate(45deg); background: var(--amber); box-shadow: 0 0 8px rgba(224,170,69,.8); }
  .lore-tl .yr { color: var(--amber-hi); letter-spacing: 2px; font-size: 15px; }
  .lore-tl .et { color: var(--ink-dim); font-size: 14px; line-height: 1.85; margin-top: 2px; }
  .crest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .crest { border: 1px solid var(--line); background: #171009; padding: 10px 12px; display: flex; gap: 12px; align-items: center; }
  .crest .sigil { flex: 0 0 42px; width: 42px; height: 42px; transform: rotate(45deg); border: 2px solid; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(0,0,0,.5); }
  .crest .sigil span { transform: rotate(-45deg); font-family: var(--kai); font-size: 19px; }
  .crest .cn { color: var(--ink); font-size: 14.5px; letter-spacing: 1px; }
  .crest .cd { color: var(--ink-dim); font-size: 12.5px; margin-top: 2px; line-height: 1.6; }
  .rank-row { display: flex; gap: 10px; align-items: center; padding: 7px 2px; border-bottom: 1px solid rgba(74,56,35,.4); font-size: 14.5px; }
  .rank-badge { flex: 0 0 32px; text-align: center; border: 1px solid; font-weight: 700; padding: 2px 0; font-size: 15px; }
  .elem-orbs { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 12px 0; }
  .elem-orb { width: 66px; text-align: center; font-size: 13px; color: var(--ink); }
  .elem-orb .o { width: 36px; height: 36px; border-radius: 50%; margin: 0 auto 5px; border: 2px solid var(--line-hi); box-shadow: inset 0 0 10px rgba(0,0,0,.6), 0 0 10px rgba(0,0,0,.5); }

  /* 人物卡 */
  .ppl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ppl-card { border: 1px solid var(--line); background: #171009; padding: 12px 14px; display: flex; gap: 12px; }
  .ppl-card.locked { opacity: .55; }
  .ppl-medal { flex: 0 0 56px; width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--amber); display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 30%, #332413, #171009 78%); color: var(--amber-hi); box-shadow: 0 0 12px rgba(224,170,69,.3); }
  .ppl-card.locked .ppl-medal { color: #6e6252; border-color: #33291d; box-shadow: none; }
  .ppl-name { color: var(--amber-hi); font-size: 16px; font-family: var(--kai); letter-spacing: 1px; }
  .ppl-role { color: var(--amber); font-size: 12px; margin-top: 2px; letter-spacing: 1px; }
  .ppl-loc { color: var(--ink-dim); font-size: 12px; margin-top: 3px; display: flex; align-items: center; gap: 4px; }
  .ppl-bio { color: var(--ink); font-size: 13.5px; line-height: 1.8; margin-top: 7px; font-family: var(--kai); }

  /* 电台 */
  .radio-row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .radio-now { border: 1px solid var(--line); padding: 8px 12px; background: #150f08; font-size: 14px; color: var(--green); min-height: 38px; display: flex; align-items: center; }
  input[type=range] { accent-color: var(--amber); }

  /* ================= 小屏适配：手机 / 平板横屏 ================= */
  /* 手机竖屏旋转提示（仅 phone-fit 模式） */
  #rotate-hint { display: none; position: fixed; inset: 0; z-index: 999;
    background: radial-gradient(circle at 50% 40%, #1a1410, #0a0704 78%);
    align-items: center; justify-content: center; flex-direction: column; gap: 34px; text-align: center; }
  .phone-fit body.portrait #rotate-hint { display: flex; }
  #rotate-hint .rh-ic { width: 88px; height: 152px; border: 4px solid var(--amber); border-radius: 16px; position: relative;
    animation: rh-spin 2.2s ease-in-out infinite; box-shadow: 0 0 30px rgba(224,170,69,.35); }
  #rotate-hint .rh-ic::after { content: ""; position: absolute; left: 50%; top: 10px; width: 30px; height: 5px; margin-left: -15px;
    background: var(--amber); border-radius: 3px; }
  @keyframes rh-spin { 0%, 22% { transform: rotate(0deg); } 62%, 100% { transform: rotate(90deg); } }
  #rotate-hint .rh-t1 { font-family: var(--kai); font-size: 46px; color: var(--amber-hi); letter-spacing: 10px; text-shadow: 0 0 18px rgba(224,170,69,.45); }
  #rotate-hint .rh-t2 { font-size: 20px; color: var(--ink-dim); letter-spacing: 3px; }
  /* 手机/平板：顶栏改纯图标，避免按钮溢出换行 */
  @media (max-width: 1024px) {
    #topbar { padding: 0 8px; gap: 2px; }
    #topbar .brand { display: none; }
    #topbar button { font-size: 0; gap: 0; padding: 6px 8px; }
    #topbar button svg { width: 17px; height: 17px; }
    #now-playing { display: none !important; }
  }
  /* 平板及以下：整体收紧 */
  @media (max-width: 1024px), (max-height: 620px) {
    #game { grid-template-rows: 40px 1fr auto; }
    #sidebar { padding: 10px 10px 14px; font-size: 12.5px; }
    .portrait { width: 60px; height: 60px; margin-bottom: 6px; }
    .portrait span { font-size: 27px; }
    .side-name { font-size: 16px; }
    .side-lv { font-size: 11px; }
    .orb { width: 52px; height: 52px; }
    .orb .v { font-size: 12px; }
    .orb .k { font-size: 9px; }
    .orb-row { gap: 8px; margin: 8px 0 4px; }
    .mini-bars { margin-top: 6px; }
    .bar { height: 7px; margin: 2px 0 5px; }
    .bar-label { font-size: 10.5px; }
    .stat-row { font-size: 12px; margin: 3px 0; }
    .side-sec { margin-top: 8px; padding-top: 6px; }
    .side-sec h4 { font-size: 10px; letter-spacing: 2px; margin-bottom: 4px; }
    .skill-line { font-size: 11px; line-height: 1.6; }
    #ui-guide-box { margin-top: 8px; padding: 7px 9px; }
    #ui-guide-box .gt { font-size: 12px; }
    #ui-guide-box .gx { font-size: 11px; line-height: 1.6; margin-top: 3px; }
    .eq-row { font-size: 11.5px; }
    #scene-bar { top: 10px; left: 12px; padding: 6px 14px 5px 10px; border-left-width: 2px; }
    #scene-title { font-size: 17px; letter-spacing: 4px; }
    #scene-sub { font-size: 10.5px; letter-spacing: 1px; }
    #log { height: 46%; padding: 30px 18px 14px; font-size: 15px; line-height: 1.9; }
    #log .sys { font-size: 13.5px; }
    #log .player-input { font-size: 13.5px; }
    #log .choice-btn { padding: 8px 12px; font-size: 14px; }
    #actions { max-height: 46vh; padding: 8px 12px 9px; gap: 6px; }
    #action-dock { gap: 6px 16px; }
    .ag-label { font-size: 9.5px; letter-spacing: 3px; }
    .ag-btns { gap: 5px; max-width: none; }
    .act-btn { min-height: 32px; padding: 5px 10px; font-size: 12.5px; }
    #input-row { gap: 6px; }
    #input-row input { padding: 8px 12px; font-size: 13.5px; }
    #input-row .btn { min-height: 34px; padding: 0 16px; font-size: 13.5px; }
    .modal { width: 620px; padding: 16px 16px 18px; }
    .modal h3 { font-size: 18px; letter-spacing: 3px; }
    .modal h4 { font-size: 12.5px; }
    .modal .lex-body { font-size: 14px; line-height: 1.9; }
    .item-row { font-size: 12.5px; }
    .best-grid, .ppl-grid, .crest-grid { grid-template-columns: 1fr; }
    .lore-body { font-size: 14px; line-height: 1.9; }
    .map-marker .nm { font-size: 13px; }
  }
  /* 窄屏手机：侧栏进一步压缩，动作坞改为横向滑动单行 */
  @media (max-width: 720px) {
    #game { grid-template-columns: 150px 1fr; }
    .portrait { width: 44px; height: 44px; }
    .portrait span { font-size: 21px; }
    .orb { width: 44px; height: 44px; }
    #log { font-size: 13.5px; line-height: 1.8; padding: 24px 12px 10px; }
    #scene-bar { top: 8px; left: 8px; padding: 4px 10px 4px 8px; }
    #scene-title { font-size: 14px; letter-spacing: 2px; }
    #scene-sub { font-size: 9.5px; }
    #action-dock { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
    .act-group { flex: 0 0 auto; }
    .ag-btns { flex-wrap: nowrap; }
    .act-btn { min-height: 30px; padding: 4px 8px; font-size: 11.5px; flex: 0 0 auto; white-space: nowrap; }
    #actions { max-height: 40vh; }
    .g-grid { grid-template-columns: 1fr; }
  }
  /* 手机横屏（高度很矮）：标题界面压缩 */
  @media (max-height: 500px) {
    #title-screen { gap: 10px; }
    #title-screen h1 { font-size: 40px; letter-spacing: 12px; text-indent: 12px; }
    #title-screen .sub { font-size: 12px; letter-spacing: 3px; }
    #title-screen .quote { font-size: 12px; letter-spacing: 2px; }
    #title-screen .menu { margin-top: 10px; width: 240px; gap: 8px; }
    .title-btn { padding: 9px 0; font-size: 15px; letter-spacing: 6px; }
    #title-screen .foot { font-size: 10px; bottom: 10px; left: 12px; }
    #title-screen .author { font-size: 16px; bottom: 10px; right: 14px; letter-spacing: 3px; }
  }
  /* 窄屏手机竖屏：标题再缩 */
  @media (max-width: 480px) {
    #title-screen h1 { font-size: 34px; letter-spacing: 8px; text-indent: 8px; }
    #title-screen .quote { font-size: 11px; padding: 0 16px; text-align: center; }
  }
  /* 移动端动态视口（浏览器地址栏伸缩） */
  @supports (height: 100dvh) {
    body, #title-screen, #game { height: 100dvh; }
  }
</style>

<body>

<!-- 全局背景画（进入游戏后显示） -->
<div id="bg-art"></div>

<!-- 手机竖屏旋转提示 -->
<div id="rotate-hint">
  <div class="rh-ic"></div>
  <div class="rh-t1">请横屏游玩</div>
  <div class="rh-t2">旋转手机，旅途即刻展开</div>
</div>

<!-- ============ 标题界面 ============ -->
<div id="title-screen">
  <h1>魔导纪元</h1>
  <div class="sub">ASTRAEA · 魔法纪元 743 年</div>
  <div class="quote">世界树枯死后的第七十二个冬天 —— 王都在远方，龙在更远方</div>
  <div class="menu">
    <button class="title-btn primary" id="continue-btn" style="display:none;">继续旅途</button>
    <button class="title-btn" id="newgame-btn">踏上旅途</button>
  </div>
  <div class="foot">铜壶与龙息 · 烬炉镇 —— 每一个传奇，都曾是无名之辈</div>
  <div class="author">作者：Lewis</div>
</div>

<!-- ============ 游戏主界面 ============ -->
<div id="game">
  <div id="topbar">
    <span class="brand">魔导纪元</span>
    <span id="now-playing"></span>
    <span class="spacer"></span>
    <button data-panel="inventory"><span data-ic="bag"></span>背包</button>
    <button data-panel="map"><span data-ic="map"></span>地图</button>
    <button data-panel="lore"><span data-ic="tree"></span>世界观</button>
    <button data-panel="people"><span data-ic="people"></span>人物卡</button>
    <button data-panel="quests"><span data-ic="scroll"></span>委托</button>
    <button data-panel="discovery"><span data-ic="compass"></span>发现日志</button>
    <button data-panel="grimoire"><span data-ic="book"></span>魔导书</button>
    <button data-panel="radio"><span data-ic="speaker"></span>旅人电台</button>
    <button data-panel="settings"><span data-ic="gear"></span>设置</button>
    <button id="fs-btn" title="全屏 / 退出全屏"><span data-ic="expand"></span></button>
  </div>
  <div id="sidebar">
    <div class="portrait"><div class="diamond"></div><span id="ui-portrait-char"></span></div>
    <div style="text-align:center;">
      <div class="side-name" id="ui-name"></div>
      <div class="side-lv"><span id="ui-level"></span> · 经验 <span id="ui-exp"></span></div>
    </div>
    <div class="orb-row">
      <div class="orb hp"><div class="v" id="ui-hp"></div><div class="k">生命</div></div>
      <div class="orb mp"><div class="v" id="ui-mp"></div><div class="k">法力</div></div>

<script>
(function () {
  const A = window.ASTREA, St = A.State, Game = A.Game, LLM = A.LLM;

  /* ================= 使用统计（匿名心跳，失败静默，不影响游戏） ================= */
  (function () {
    if (!/^https?:$/.test(location.protocol)) return; // file:// 本地打开不统计
    if (localStorage.getItem("astraea_no_track")) return; // 作者本人浏览器不统计
    const rid = p => { try { return crypto.randomUUID(); } catch (e) { return p + Date.now() + Math.random().toString(16).slice(2); } };
    let pid = localStorage.getItem("astraea_pid");
    if (!pid) { pid = rid("p"); localStorage.setItem("astraea_pid", pid); }
    // 作者本人已知的 pid 直接不发心跳（双保险，服务端 exclude_pids.txt 还会再拦一次）
    if (["27eb8645-374e-44ca-a7ce-9186115000b7", "ad00afa9-7b09-4e73-8d7e-2c158ecfddcf"].indexOf(pid) >= 0) return;
    let sid = sessionStorage.getItem("astraea_sid");
    if (!sid) { sid = rid("s"); sessionStorage.setItem("astraea_sid", sid); }
    let endpoint = null;
    async function discover() {
      try {
        const r = await fetch("tracker.json?_=" + Date.now(), { cache: "no-store" });
        const j = await r.json();
        endpoint = (j && typeof j.endpoint === "string" && j.endpoint.indexOf("https://") === 0) ? j.endpoint : null;
      } catch (e) { endpoint = null; }
    }
    function ping() {
      if (!endpoint) return;
      fetch(endpoint + "/ping?pid=" + encodeURIComponent(pid) + "&sid=" + encodeURIComponent(sid),
        { mode: "cors", keepalive: true, cache: "no-store" }).catch(() => {});
    }
    discover().then(ping);
    setInterval(discover, 5 * 60 * 1000); // 每 5 分钟重新发现入口（隧道重开会换地址）
    setInterval(ping, 30000);
  })();

  /* ================= 手机：竖屏遮罩 + 首次点击尝试全屏锁横屏（仅安卓，失败静默） ================= */
  (function () {
    if (!document.documentElement.classList.contains("phone-fit")) return;
    var sync = function () { document.body.classList.toggle("portrait", window.innerWidth < window.innerHeight); };
    window.addEventListener("resize", sync);
    window.addEventListener("orientationchange", function () { setTimeout(sync, 60); });
    sync();
    var tryLock = function () {
      document.removeEventListener("pointerdown", tryLock);
      try {
        var el = document.documentElement;
        var p = el.requestFullscreen ? el.requestFullscreen() : Promise.resolve();
        Promise.resolve(p).then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
        }).catch(function () {});
      } catch (e) {}
    };
    document.addEventListener("pointerdown", tryLock);
  })();
  const $ = id => document.getElementById(id);

  /* ================= 图标库（内联 SVG，描边风格） ================= */
  const ICONS = {
    bag: '<path d="M5 8h14l-1.5 12h-11L5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
    map: '<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z"/><path d="M9 4v14M15 6v14"/>',
    scroll: '<path d="M8 4h9a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8"/><path d="M8 4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2"/><path d="M8 4v16"/><path d="M11 9h5M11 13h5"/>',
    compass: '<circle cx="12" cy="12" r="9"/><path d="M15 9l-2 5-4 1 2-5 4-1z"/>',
    book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13"/><path d="M9 7h6"/>',
    lyre: '<path d="M7 4v8a5 5 0 0 0 10 0V4"/><path d="M5 4h14"/><path d="M12 12v8"/><path d="M9 20h6"/>',
    gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>',
    tree: '<circle cx="12" cy="8" r="5"/><path d="M12 13v8M7 21h10"/><path d="M12 8c-2.5 0-4.5-2-4.5-4.5C10 3.5 12 5.5 12 8zM12 8c2.5 0 4.5-2 4.5-4.5C14 3.5 12 5.5 12 8z"/>',
    people: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.5A5 5 0 0 1 21 19"/>',
    expand: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    contract: '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',
    bread: '<path d="M5 9a7 4 0 0 1 14 0v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9z"/><path d="M9 13h.01M12 15h.01M15 13h.01"/>',
    drop: '<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>',
    coin: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/>',
    pack: '<path d="M8 7V6a4 4 0 0 1 8 0v1"/><rect x="5" y="7" width="14" height="13" rx="2"/><path d="M5 12h14"/>',
    sword: '<path d="M5 19 19 5"/><path d="M19 5l-3 1M19 5l-1 3"/><path d="M7 15l2 2"/><path d="M4 20l2-2"/>',
    chat: '<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4V6z"/>',
    boot: '<path d="M7 3v10l-3 3v5h13v-3l-6-2-4-4V3H7z"/>',
    arrow: '<path d="M4 12h14"/><path d="M13 6l6 6-6 6"/>',
    home: '<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/>',
    anvil: '<path d="M4 7h16v3c-4 0-6 2-6 4h-4c0-2-2-4-6-4V7z"/><path d="M10 14v4M7 20h10"/>',
    shop: '<path d="M5 9l1-4h12l1 4"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/>',
    board: '<rect x="5" y="4" width="14" height="11"/><path d="M9 15v5M15 15v5"/><path d="M8 8h8M8 11h5"/>',
    gate: '<path d="M5 20V9l7-5 7 5v11"/><path d="M5 20h14"/><path d="M12 20v-8"/>',
    tower: '<path d="M8 21V8l-2-2 2-3h8l2 3-2 2v13"/><path d="M8 21h8"/><path d="M10 12h4"/>',
    cave: '<path d="M3 20c0-8 4-14 9-14s9 6 9 14"/><path d="M8 20c0-4 1.5-7 4-7s4 3 4 7"/>',
    shrine: '<path d="M4 9l8-6 8 6"/><path d="M6 9v11M18 9v11"/><path d="M4 20h16"/><path d="M12 13v4"/>',
    fog: '<path d="M4 9h16M6 13h12M4 17h16"/>',
    flame: '<path d="M12 3c1 4 6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 5-7 6-11z"/>',
    mountain: '<path d="M3 19 9 7l4 6 3-4 5 10H3z"/>',
    eye: '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/>',
    gem: '<path d="M7 4h10l3 5-8 11L4 9l3-5z"/><path d="M4 9h16"/><path d="M12 20 9 9M12 20l3-11"/>',
    flask: '<path d="M10 3h4"/><path d="M11 3v5l-5 9a3 3 0 0 0 3 4h6a3 3 0 0 0 3-4l-5-9V3"/><path d="M8 14h8"/>',
    ore: '<path d="M6 5l7-2 6 6-2 8-7 3-6-6 2-9z"/>',
    hammer: '<path d="M13 4l7 7-3 3-7-7 3-3z"/><path d="M10 11 4 17l3 3 6-6"/>',
    lock: '<rect x="6" y="11" width="12" height="9"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/><circle cx="12" cy="15.5" r="1.2"/>',
    star: '<path d="M12 3l2.6 5.6L20 9.4l-4 4 1 5.8-5-2.8-5 2.8 1-5.8-4-4 5.4-.8L12 3z"/>',
    leaf: '<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15z"/><path d="M5 19c3-6 7-9 11-11"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/>',
    hourglass: '<path d="M7 3h10M7 21h10"/><path d="M8 3v3c0 3 4 4 4 6s-4 3-4 6v3M16 3v3c0 3-4 4-4 6s4 3 4 6v3"/>',
    question: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.3-1 .8-1 1.7"/><path d="M12 16.5h.01"/>',
    tent: '<path d="M12 4 3 20h18L12 4z"/><path d="M12 12l-3 8h6l-3-8z"/>',
    speaker: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/>',
    dice: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 9h.01M12 12h.01M9 15h.01M15 15h.01"/>'
  };
  function ic(name, size) {
    size = size || 14;
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ""}</svg>`;
  }
  // 静态图标水合：<span data-ic="bag"></span> → SVG
  document.querySelectorAll("[data-ic]").forEach(el => { el.innerHTML = ic(el.dataset.ic, 14); });

  /* ================= 全屏模式 ================= */
  $("fs-btn").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  document.addEventListener("fullscreenchange", () => {
    const sp = $("fs-btn").querySelector("span");
    if (sp) sp.innerHTML = ic(document.fullscreenElement ? "contract" : "expand", 14);
  });

  /* ================= 标题界面 ================= */
  let chosenElement = "fire";
  if (St.hasSave()) $("continue-btn").style.display = "";
  $("continue-btn").onclick = () => {
    if (!St.load()) { alert("存档读取失败，请开始新游戏。"); return; }
    enterGame();
    print("（你回到了旅途中。）", true);
    render();
  };
  $("newgame-btn").onclick = () => openGrimoireModal();

  function openGrimoireModal() {
    const cards = A.DATA.grimoires.elements.map(el => {
      const b = A.DATA.grimoires.books[el];
      return `<div class="g-card ${el === chosenElement ? "sel" : ""}" data-el="${el}">
        <div class="gn">${A.DATA.grimoires.element_names[el]} · ${b.name}</div>
        <div class="gd">${b.pages.map(p => p.name).join(" → ")}</div>
        <div class="gd" style="margin-top:4px">${b.pages[0].desc}</div></div>`;
    }).join("");
    showModal(`<h3>选择你的魔导书</h3>
      <div class="dim" style="text-align:center">每个觉醒者生来绑定一本魔导书，它将决定你一生魔法的大方向。<br>人死书散，不可更换——慎重。</div>
      <div class="settings-row" style="margin-top:12px"><span style="width:60px">名字</span><input id="name-input" placeholder="无名者" maxlength="12"></div>
      <div class="g-grid">${cards}</div>
      <div style="text-align:center;margin-top:6px"><button class="btn primary" id="start-btn" style="font-size:16px;padding:10px 34px;letter-spacing:6px;">觉醒</button></div>
      <div class="dim" style="text-align:center;margin-top:14px;letter-spacing:4px;">作者：Lewis</div>`);
    document.querySelectorAll(".g-card").forEach(c => c.onclick = () => {
      chosenElement = c.dataset.el;
      document.querySelectorAll(".g-card").forEach(x => x.classList.remove("sel"));
      c.classList.add("sel");
    });
    $("start-btn").onclick = () => {
      St.newGame($("name-input").value.trim() || "无名者", chosenElement);
      Game.refreshBoard();
      St.save();
      $("modal-mask").style.display = "none";
      enterGame();
      print("烬炉镇的清晨有打铁声和面包香。你在「铜壶与龙息」的阁楼醒来，左手手背上，魔导书的烙印微微发热——「" + A.DATA.grimoires.books[chosenElement].name + "」，它选了你。\n玛尔塔在楼下喊：\"醒了就下来吃饭！吃饱了——天大的事再说。\"", true);
      render();
    };
  }

  function enterGame() {
    $("title-screen").style.display = "none";
    $("bg-art").style.display = "block";
    $("game").style.display = "grid";
    Radio.autoplay(); // 进游戏即开播（随机顺序），旅人的世界先有声音
  }

  /* ================= 名词词条 ================= */
  let LEX_TERMS = null; // [ [surfaceTerm, entry], ... ] 按词长降序，长词优先避免嵌套误配
  function lexTerms() {
    if (LEX_TERMS) return LEX_TERMS;
    const map = new Map();
    for (const e of (A.DATA.lexicon || [])) {
      for (const t of e.terms) if (!map.has(t)) map.set(t, e);
    }
    LEX_TERMS = [...map.entries()].sort((a, b) => b[0].length - a[0].length);
    return LEX_TERMS;
  }
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function wrapLexicon(escaped) {
    let out = escaped;
    const used = []; // { entry, term }
    for (const [term, entry] of lexTerms()) {
      if (!out.includes(term)) continue;
      const tok = "\u0001" + used.length + "\u0001";
      out = out.split(term).join(tok);
      used.push({ entry, term });
    }
    return out.replace(/\u0001(\d+)\u0001/g, (m, i) => {
      const u = used[+i];
      return `<span class="lex" data-name="${u.entry.name}">${u.term}</span>`;
    });
  }
  function openLexiconCard(name) {
    const e = (A.DATA.lexicon || []).find(x => x.name === name);
    if (!e) return;
    showModal(`<h3>${e.name}</h3><div style="text-align:center"><span class="lex-type">${e.type}</span></div><div class="lex-body">${e.desc}</div>`);
  }

  /* ================= 叙事输出 ================= */
  function print(text, isSys) {
    const inner = $("log-inner");
    const div = document.createElement("div");
    const combatTxt = /遭遇战斗|【战斗胜利】|倒下了|发起了猎杀|反击|逃出了战斗|受到了|造成了|命中/.test(text || "");
    div.className = "entry" + (isSys ? " sys" : "") + (combatTxt ? " combat" : "");
    if (isSys) div.textContent = text;
    else div.innerHTML = wrapLexicon(escapeHtml(text));
    inner.appendChild(div);
    const hr = document.createElement("div");
    hr.className = "divider"; hr.innerHTML = "<span></span>";
    inner.appendChild(hr);
    $("log").scrollTop = $("log").scrollHeight;
  }
  // 点击叙事中的专有名词 → 弹出信息卡
  $("log").addEventListener("click", e => {
    const sp = e.target.closest(".lex");
    if (sp) openLexiconCard(sp.dataset.name);
  });

  /* ================= 渲染 ================= */
  function render() {
    const s = St.get(); if (!s) return;
    const p = s.player;
    const ndef = Game.nodeDef(p.location.region, p.location.node);
    $("scene-title").textContent = ndef.name;
    $("scene-sub").textContent = Game.regionName(p.location.region) + " · " + St.timeName() + " · 天气 " + Game.weatherName(s.weather) + " · " + St.repTitle() + "（声望 " + p.reputation + "）";
    // 换地点时牌匾重新滑入
    const sbar = $("scene-bar"), locKey = p.location.region + "/" + p.location.node;
    if (sbar.dataset.loc !== locKey) {
      sbar.dataset.loc = locKey;
      sbar.style.animation = "none"; void sbar.offsetWidth; sbar.style.animation = "";
    }
    // 场景画幅：换地方就换画（酒馆有专属内景）
    const sceneKey = (p.location.region === "ashford" && p.location.node === "tavern") ? "tavern" : p.location.region;
    const sceneSrc = "assets/scene-" + sceneKey + ".png";
    const simg = $("scene-img");
    if (!simg.getAttribute("src").endsWith("scene-" + sceneKey + ".png")) {
      simg.style.opacity = 0;
      const pre = new Image();
      pre.onload = () => { simg.src = sceneSrc; simg.style.opacity = 1; };
      pre.onerror = () => { simg.src = sceneSrc; simg.style.opacity = 1; };
      pre.src = sceneSrc;
    }
    // 氛围层：时段 × 天气 × 战斗态，全写在画面的光影上
    const main = $("main");
    main.className = "seg-" + (s.timeSeg || 0) + " w-" + (s.weather || "clear") + (Game.combat ? " in-combat" : "");
    // 装备槽
    for (const slot of ["weapon", "armor"]) {
      const cur = p.equipment && p.equipment[slot];
      const el = $("ui-eq-" + slot);
      if (cur && A.DATA.items[cur]) {
        const d = A.DATA.items[cur];
        el.innerHTML = `<span class="eq-name">${d.name}</span><span class="eq-stat">${slot === "weapon" ? "攻+" + d.atk : "防+" + d.def}</span><button onclick="UI.unequip('${slot}')">卸下</button>`;
      } else {
        el.innerHTML = `<span class="eq-none">${slot === "weapon" ? "武器：徒手" : "护甲：布衣"}</span>`;
      }
    }
    $("ui-portrait-char").textContent = (p.name || "无").slice(0, 1);
    $("ui-name").textContent = p.name;
    $("ui-level").textContent = "Lv." + p.level;
    $("ui-exp").textContent = p.exp + "/" + (p.level * 60);
    $("ui-hp").textContent = p.hp + "/" + p.maxHp;
    $("ui-mp").textContent = p.mp + "/" + p.maxMp;
    $("ui-foodbar").style.width = (p.food / 10 * 100) + "%";
    $("ui-waterbar").style.width = (p.water / 10 * 100) + "%";
    $("ui-food-v").textContent = p.food + "/10";
    $("ui-water-v").textContent = p.water + "/10";
    $("ui-gold").textContent = p.gold;
    $("ui-weight").textContent = p.inventory.length + "/20";
    const gi = Game.guideInfo();
    $("ui-guide-tag").textContent = gi.tag;
    $("ui-guide-title").textContent = gi.title;
    $("ui-guide-text").textContent = gi.text;
    const book = A.DATA.grimoires.books[p.grimoire.element];
    $("ui-grimoire").innerHTML = "<div style='text-align:center'>" + book.name + "</div>" +
      book.pages.map(pg => p.level >= pg.unlock_lvl
        ? `<div class="skill-line un">第${pg.page}页 · ${pg.name}</div>`
        : `<div class="skill-line" style="opacity:.38">第${pg.page}页 · 未翻开（Lv.${pg.unlock_lvl}）</div>`).join("");
    $("ui-companion").textContent = p.companions.with ? A.DATA.npcs[p.companions.with].name + " 同行中" : "无";
    $("ui-combat").innerHTML = Game.combat
      ? `<span style="color:var(--red)">${Game.combat.displayName}</span><br>HP ${Game.combat.hp} / ${Game.combat.maxHp}`
      : "—";
    renderActions();
  }

  /* ============ 动作坞：按 战斗/交涉/委托/行动/移动 分组 ============ */
  const ACTION_GROUPS = [
    { name: "战斗", cls: "g-combat", icon: "sword",  match: a => a.id.indexOf("combat_") === 0 || a.id === "elite_fight" },
    { name: "交涉", cls: "g-talk",   icon: "chat",   match: a => ["talk", "introduce", "invite", "dismiss"].includes(a.id) },
    { name: "委托", cls: "g-quest",  icon: "scroll", match: a => ["turnin", "accept_quest", "decline_offer", "deserter_catch", "deserter_free"].includes(a.id) },
    { name: "行动", cls: "g-act",    icon: "boot",   match: a => ["explore", "camp", "rest", "news", "hone", "shop", "board", "dice", "craft", "armory"].includes(a.id) },
    { name: "移动", cls: "g-move",   icon: "arrow",  match: a => a.id === "move" }
  ];
  const ACT_ICON = {
    move: "arrow", talk: "chat", introduce: "people", invite: "people", dismiss: "people",
    turnin: "scroll", accept_quest: "scroll", decline_offer: "arrow",
    explore: "eye", camp: "tent", rest: "home", news: "lyre", hone: "anvil", shop: "shop", board: "board",
    dice: "dice", craft: "anvil", armory: "sword", elite_fight: "sword",
    deserter_catch: "shield", deserter_free: "arrow",
    combat_attack: "sword", combat_skill: "star", combat_item: "flask", combat_flee: "arrow"
  };
  function renderActions() {
    const dock = $("action-dock");
    dock.innerHTML = "";
    const acts = Game.availableActions();
    for (const g of ACTION_GROUPS) {
      const list = acts.filter(g.match);
      if (!list.length) continue;
      const sec = document.createElement("div");
      sec.className = "act-group " + g.cls;
      const lb = document.createElement("span");
      lb.className = "ag-label"; lb.innerHTML = ic(g.icon, 12) + g.name;
      sec.appendChild(lb);
      const row = document.createElement("div");
      row.className = "ag-btns";
      for (const act of list) {
        const b = document.createElement("button");
        b.className = "btn act-btn";
        b.innerHTML = (ACT_ICON[act.id] ? ic(ACT_ICON[act.id], 12) : "") + act.label;
        if (act.disabled) { b.disabled = true; b.classList.add("exhausted"); }
        else b.onclick = () => dispatch(act);
        row.appendChild(b);
      }
      sec.appendChild(row);
      dock.appendChild(sec);
    }
  }

  function dispatch(act) {
    staleChoices(); // 玩家改用按钮行动，旧的文字选项失效
    if (act.id === "shop") return openShop(act.payload);
    if (act.id === "board") return openBoard();
    const res = Game.doAction(act);
    if (res && typeof res === "object") {
      if (res.openShop) return openShop(res.openShop);
      if (res.openBoard) return openBoard();
      if (res.openPanel) return openPanel(res.openPanel);
      if (res.openDice) return openDice();
      if (res.openCraft) return openCraft();
    }
    if (typeof res === "string" && res) print(res);
    render();
  }

  /* ================= 剧情选项按钮 ================= */
  function staleChoices() {
    document.querySelectorAll("#log-inner .choices").forEach(box => {
      box.classList.add("stale");
      box.querySelectorAll("button").forEach(b => { b.disabled = true; b.onclick = null; });
    });
  }
  function printChoices(choices) {
    if (!choices || !choices.length) return;
    const inner = $("log-inner");
    const box = document.createElement("div");
    box.className = "choices";
    for (const c of choices) {
      const b = document.createElement("button");
      b.className = "choice-btn";
      b.innerHTML = ic("arrow", 13) + "<span>" + escapeHtml(c) + "</span>";
      b.onclick = () => submitText(c);
      box.appendChild(b);
    }
    inner.appendChild(box);
    $("log").scrollTop = $("log").scrollHeight;
  }

  /* ================= 输入 ================= */
  function send() {
    const input = $("cmd-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    submitText(text);
  }
  async function submitText(text) {
    staleChoices(); // 旧选项即刻失效，剧情只向前
    const div = document.createElement("div");
    div.className = "player-input";
    div.textContent = "＞ " + text;
    $("log-inner").appendChild(div);
    const cfg = LLM.getSettings();
    if (cfg.mode === "api" && cfg.apiKey) {
      print("（远方的叙事者正在落笔……）", true);
      try {
        const res = await Game.handleApiText(text);
        print(res.text);
        if (res.choices && res.choices.length) printChoices(res.choices);
      } catch (e) {
        let em = e.message || "";
        if (/401|Authentication|invalid.*key/i.test(em)) em = "API Key 无效或已过期（401）——到设置页用「测试连接」排查";
        else if (/Failed to fetch|NetworkError|Load failed/i.test(em)) em = "连不上 API 服务器——检查 Base URL 是否完整、网络是否正常";
        else if (/model|Model|404/.test(em)) em = "模型名有误——DeepSeek 应填 deepseek-chat（设置页有常用模型名对照）";
        else if (/402|balance|quota|insufficient/i.test(em)) em = "API 账户余额不足——充值后重试";
        print("叙事通道中断：" + em + "（本次输入已按离线模式处理）", true);
        const res = Game.handleOfflineText(text);
        if (typeof res === "string") print(res); else if (res.openShop) openShop(res.openShop); else if (res.openBoard) openBoard(); else if (res.openPanel) openPanel(res.openPanel);
      }
    } else {
      const res = Game.handleOfflineText(text);
      if (typeof res === "string") print(res);
      else if (res.openShop) openShop(res.openShop);
      else if (res.openBoard) openBoard();
      else if (res.openPanel) openPanel(res.openPanel);
    }
    render();
  }
  $("send-btn").onclick = send;
  $("cmd-input").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

  /* ================= 弹层 ================= */
  $("modal-close").onclick = () => $("modal-mask").style.display = "none";
  $("modal-mask").addEventListener("click", e => { if (e.target === $("modal-mask")) $("modal-mask").style.display = "none"; });
  function showModal(html, wide) {
    $("modal-body").innerHTML = html;
    document.querySelector("#modal-mask .modal").classList.toggle("wide", !!wide);
    $("modal-mask").style.display = "flex";
  }

  document.querySelectorAll("#topbar button[data-panel]").forEach(b => {
    b.onclick = () => openPanel(b.dataset.panel);
  });

  /* ================= 面板 ================= */
  const ITEM_ICON = { supply: "bread", consumable: "flask", material: "ore", tool: "hammer", quest: "scroll", treasure: "gem" };
  const ITEM_ICON_BY_ID = { ration: "bread", water_skin: "drop", torch: "flame", rope: "pack", potion_heal: "flask", potion_mana: "drop", moonlute: "lyre", dragon_scale_shard: "gem", moss_stanch: "leaf", moss_moon: "leaf", herb_mist: "leaf", storm_moss: "leaf" };
  function itemIcon(id) {
    const d = A.DATA.items[id];
    return `<span class="itm-ic">${ic(ITEM_ICON_BY_ID[id] || ITEM_ICON[d ? d.type : ""] || "bag", 13)}</span>`;
  }
  function openPanel(panel) {
    const p = St.get().player;
    if (panel === "inventory") {
      const rows = p.inventory.map(s => {
        const d = A.DATA.items[s.id];
        const usable = d && d.effect && d.type !== "tool";
        const equipable = d && d.type === "equip";
        const sellable = d && d.type !== "quest" && d.price;
        const atHome = p.location.region === "ashford" && p.location.node === "tavern";
        const stat = equipable ? `（${d.slot === "weapon" ? "攻击 +" + d.atk : "防御 +" + d.def}）` : "";
        return `<div class="item-row"><span>${itemIcon(s.id)}${d ? d.name : s.id} ×${s.n}${stat} <span class="dim">${d ? d.desc : ""}</span></span>
          <span class="ops">${usable ? `<button onclick="UI.invAct('use','${s.id}')">使用</button>` : ""}
          ${equipable ? `<button onclick="UI.invAct('equip','${s.id}')">装备</button>` : ""}
          ${sellable ? `<button onclick="UI.invAct('sell','${s.id}')">卖出</button>` : ""}
          ${atHome ? `<button onclick="UI.invAct('deposit','${s.id}')">存入</button>` : ""}</span></div>`;
      }).join("") || "<div class='dim'>背包空空如也。</div>";
      const storage = (p.location.region === "ashford" && p.location.node === "tavern")
        ? "<h4>家中仓库（" + p.storage.length + "/40）</h4>" +
          (p.storage.map(s => { const d = A.DATA.items[s.id];
            return `<div class="item-row"><span>${d ? d.name : s.id} ×${s.n}</span><span class="ops"><button onclick="UI.invAct('withdraw','${s.id}')">取出</button></span></div>`; }).join("") || "<div class='dim'>仓库是空的。</div>")
        : "";
      showModal("<h3>背包（" + p.inventory.length + "/20）</h3>" + rows + storage);
    }
    if (panel === "map") {
      const disc = p.discovery.locations;
      const here = p.location.region;
      const MK = [
        { id: "ashford",       nm: "烬炉镇",   x: 81, y: 55, play: true, info: "边境小镇，你的家。铜壶与龙息的壁炉永远给你留着位置。" },
        { id: "mistwood",      nm: "雾帷森林", x: 52, y: 22, play: true, info: "终年轻雾的古林（危险度 D/C）。狼群、药草、猎户小屋。走得越急，迷得越深。" },
        { id: "lavarift",      nm: "熔痕裂谷", x: 76, y: 30, play: true, info: "大地的热伤（危险度 C/B）。火纹矿、矿工营地，以及压低声音的灰烬会传闻。" },
        { id: "thunderpass",   nm: "雷鸣山口", x: 20, y: 18, play: true, info: "风暴盘踞的山口（危险度 B）。雷鹰在崖顶筑巢，山龛里的老人守着比国家更旧的誓约。" },
        { id: "westwatch",     nm: "西林哨所", x: 12, y: 38, play: true, info: "王国西陲的军镇（危险度 C）。百夫长卫霜在这里盯着西境的每一缕烟。" },
        { id: "capital",       nm: "圣辉城",   x: 56, y: 45, locked: true, info: "魔法帝与八大骑士团驻地。八座尖塔在所有人嘴里——辉门查验纹章，你现在进不去。但它就在那儿，总有一天。" },
        { id: "mirror_lake",   nm: "镜湖",     x: 34, y: 48, locked: true, info: "吟游诗人的故乡。据说湖水能照见人心里的事。没人说得出确切的路。" },
        { id: "dragon_wastes", nm: "龙眠荒原", x: 90, y: 21, locked: true, info: "S 级禁区。地图上是一片骷髅标记。任何劝阻你前往的人，都是对的。" },
        { id: "whitesail",     nm: "白帆城",   x: 15, y: 78, locked: true, info: "南岸的港城，船帆比屋顶多。海那边的事，只有水手说得清。" },
        { id: "windgrass",     nm: "风语草原", x: 14, y: 54, locked: true, info: "草浪会传话的地方。游牧部落在风里扎营，也在风里消失。" },
        { id: "ashenfen",      nm: "灰潮沼泽", x: 60, y: 68, locked: true, info: "西境战争的老战场。雾里有不肯散去的名字。" },
        { id: "royal_tomb",    nm: "苍岩王陵", x: 37, y: 12, locked: true, info: "旧王朝的长眠之地。守陵人的灯，七十年没灭过。" }
      ];
      const markers = MK.map(m => {
        const known = disc.some(l => l.startsWith(m.id + "/"));
        const cls = m.locked && !known ? "locked" : "";
        const hereCls = (here === m.id) ? "here" : "";
        return `<div class="map-marker ${cls} ${hereCls}" style="left:${m.x}%;top:${m.y}%" data-rid="${m.id}" data-play="${m.play ? 1 : 0}" data-info="${m.info.replace(/"/g, "&quot;")}">
          <div class="pin"></div><div class="nm">${m.nm}${m.locked ? "（未至）" : ""}</div></div>`;
      }).join("");
      showModal(`<h3>阿斯特雷亚 · 舆图</h3>
        <div class="map-wrap"><img src="assets/map.png" alt="阿斯特雷亚大陆舆图">${markers}</div>
        <div id="map-info" class="dim">点选金色地名进入该区域的小地图；灰色地名为未至之地，点选查看传闻。</div>`, true);
      document.querySelectorAll(".map-marker").forEach(mk => mk.onclick = () => {
        if (mk.dataset.play === "1") return openRegionMap(mk.dataset.rid);
        $("map-info").textContent = mk.dataset.info;
        if (mk.classList.contains("locked")) $("map-info").textContent += "——此地尚未开放：它不拦有耐心的人。跟着主线委托一步步走，路会自己打开。";
        $("map-info").className = "";
      });
    }
    if (panel === "quests") {
      const active = p.quests.filter(q => q.state !== "done");
      const mains = active.filter(q => { const d = Game.questDef(q.id); return d && d.series === "main"; });
      const sides = active.filter(q => { const d = Game.questDef(q.id); return d && d.series === "side"; });
      const row = (q, isMain) => {
        const d = Game.questDef(q.id);
        const st = d.auto ? "" : (q.state === "ready" ? "【可交付】" : `（${q.progress || 0}/${d.objective.count || 1}）`);
        const hint = (isMain && d.hint) ? `<br><span class="dim" style="color:var(--amber)">${d.hint}</span>` : "";
        return `<div class="item-row"><span>${isMain ? `<span class="quest-main-badge">主线</span> ` : `<span class="quest-rank">[${d.rank}]</span> `}${d.name} ${st}<br><span class="dim">${d.brief}</span>${hint}</span></div>`;
      };
      const mainRows = mains.map(q => row(q, true)).join("");
      const sideRows = sides.map(q => row(q, false)).join("");
      const bq = p.boardQuests.filter(q => q.state === "active" || q.state === "ready").map(q =>
        `<div class="item-row"><span><span class="quest-rank">[D]</span> ${q.name} ${q.state === "ready" ? "【可交付：芬恩】" : `（${q.progress || 0}/${q.count}）`}</span></div>`).join("");
      const doneMain = p.quests.filter(q => q.state === "done" && Game.questDef(q.id) && Game.questDef(q.id).series === "main").length;
      const doneSide = p.quests.filter(q => q.state === "done" && Game.questDef(q.id) && Game.questDef(q.id).series === "side").length;
      showModal("<h3>委托日志</h3>" +
        `<div class="quest-sec">主线 · 传奇之路（已完成 ${doneMain}/6 章）</div>` +
        (mainRows || "<div class='dim'>主线已推进至当前章节的尽头——自由探索吧，世界还很大。</div>") +
        `<div class="quest-sec side">支线 · 世界撞上来的事（已完成 ${doneSide}）</div>` +
        (sideRows || "<div class='dim'>暂无进行中的支线。委托主要在世界里'撞上'——多出去走走。</div>") +
        (bq ? `<div class="quest-sec board">悬赏板 · 杂活</div>` + bq : ""));
    }
    if (panel === "discovery") {
      const d = p.discovery;
      const sec = (title, arr, fmt) => `<h4>${title}（${arr.length}）</h4>` +
        (arr.length ? arr.map(x => `<div class="dim">· ${fmt(x)}</div>`).join("") : "<div class='dim'>尚无记录。</div>");
      // 魔物图鉴卡：击杀数 / 弱点 / 生态 / 战利品
      const elNames = A.DATA.grimoires.element_names || {};
      const best = d.monsters.length ? `<div class="best-grid">` + d.monsters.map(x => {
        const m = A.DATA.monsters[x];
        if (!m) return "";
        const kills = St.getFlag("mob_kill_" + x) || 0;
        const drops = (m.drops || []).map(dr => A.DATA.items[dr.id] ? A.DATA.items[dr.id].name : dr.id).join("、") || "无";
        return `<div class="best-card"><div class="bn">${m.name}</div>
          <div class="bs"><span>讨伐 <b>${kills}</b></span><span>弱点 <b>${elNames[m.weak] || m.weak || "未知"}</b></span></div>
          <div class="bl">${m.lore || m.desc}</div>
          <div class="bd">战利品：${drops}</div></div>`;
      }).join("") + `</div>` : "<div class='dim'>尚无记录——第一次遭遇总是最危险的，活下来就有记录了。</div>";
      showModal("<h3>发现日志</h3>" +
        sec("地点", d.locations, x => x === "ash_mark" ? "？？？（摆成人形的灰）" : x === "scale_ledge" ? "熔痕裂谷 · 龙鳞岩台" : (() => { const [r, n] = x.split("/"); return Game.regionName(r) + " · " + Game.nodeDef(r, n).name; })()) +
        sec("传闻", d.rumors, x => { const r = A.DATA.rumors.find(r => r.id === x); return r ? r.text : x; }) +
        `<h4>魔物图鉴（${d.monsters.length}）</h4>` + best +
        sec("植物", d.plants, x => { const i = A.DATA.items[x]; return i ? `${i.name} — ${i.desc}` : x; }), true);
    }
    if (panel === "grimoire") {
      const book = A.DATA.grimoires.books[p.grimoire.element];
      showModal("<h3>" + book.name + "</h3>" + book.pages.map(pg => {
        const un = p.level >= pg.unlock_lvl;
        return `<div class="item-row"><span>${un ? "✦ " : "· "}第${pg.page}页 · ${pg.name}
          <span class="dim">（MP${pg.mp}${pg.dmg ? " · 伤害" + pg.dmg : ""}${pg.heal ? " · 恢复" + pg.heal : ""}）</span><br>
          <span class="dim">${un ? pg.desc : "这一页还未为你翻开（需 Lv." + pg.unlock_lvl + "）。变强的本质，是让魔导书愿意为你翻页。"}</span></span></div>`;
      }).join(""));
    }
    if (panel === "lore") openLore();
    if (panel === "people") openPeople();
    if (panel === "radio") openRadio();
    if (panel === "settings") {
      const cfg = LLM.getSettings();
      showModal(`<h3>设置</h3>
        <div class="settings-row"><span style="width:90px">叙事模式</span>
          <select id="set-mode"><option value="offline" ${cfg.mode === "offline" ? "selected" : ""}>离线模式（内置叙事器，无需 API）</option>
          <option value="api" ${cfg.mode === "api" ? "selected" : ""}>API 模式（OpenAI 兼容）</option></select></div>
        <div class="settings-row"><span style="width:90px">Base URL</span><input id="set-url" value="${cfg.baseUrl}"></div>
        <div class="settings-row"><span style="width:90px">API Key</span><input id="set-key" type="password" value="${cfg.apiKey}"></div>
        <div class="settings-row"><span style="width:90px">模型</span><input id="set-model" value="${cfg.model}" placeholder="如 deepseek-chat / gpt-4o-mini"></div>
        <div class="dim" style="margin:2px 0 4px 98px">常用模型名（须一字不差）：DeepSeek → deepseek-chat；OpenAI → gpt-4o-mini；Kimi → moonshot-v1-8k</div>
        <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <button class="btn primary" id="set-save">保存设置</button>
          <button class="btn" id="set-test">测试连接</button>
          <button class="btn" id="set-archive">手动存档</button>
          <button class="btn" id="set-wipe" style="color:var(--red)">删除存档</button>
        </div>
        <div id="set-test-result" class="dim" style="margin-top:6px"></div>
        <h4>存档文件（换浏览器/换设备用）</h4>
        <div class="settings-row">
          <button class="btn" id="set-export">导出存档文件</button>
          <button class="btn" id="set-import-btn">导入存档文件</button>
          <input type="file" id="set-import" accept=".json" style="display:none">
        </div>
        <div class="dim" style="margin-top:10px">存档保存在本机浏览器（localStorage），每回合自动存档；注意：用不同浏览器或不同方式打开页面时存档互不相通，跨环境请先「导出存档文件」。API Key 仅存在本机。</div>`);
      $("set-save").onclick = () => {
        LLM.saveSettings({ mode: $("set-mode").value, baseUrl: $("set-url").value.trim(), apiKey: $("set-key").value.trim(), model: $("set-model").value.trim() });
        print("设置已保存。", true); $("modal-mask").style.display = "none";
      };
      $("set-test").onclick = async () => {
        const r = $("set-test-result");
        r.style.color = "var(--ink-dim)";
        r.textContent = "正在连接 API……";
        const res = await LLM.testConnection({ baseUrl: $("set-url").value.trim(), apiKey: $("set-key").value.trim(), model: $("set-model").value.trim() });
        r.style.color = res.ok ? "var(--green)" : "var(--red)";
        r.textContent = (res.ok ? "✓ " : "✕ ") + res.msg;
      };
      $("set-archive").onclick = () => { St.save(); print("已手动存档。", true); };
      $("set-wipe").onclick = () => { if (confirm("确定删除存档？此操作不可恢复。")) { St.wipe(); location.reload(); } };
      $("set-export").onclick = () => {
        St.save();
        const raw = localStorage.getItem(St.SAVE_KEY);
        if (!raw) { print("还没有可导出的存档。", true); return; }
        const blob = new Blob([raw], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "astraea-save-" + new Date().toISOString().slice(0, 10) + ".json";
        a.click();
        URL.revokeObjectURL(a.href);
        print("存档文件已导出到下载目录。", true);
      };
      $("set-import-btn").onclick = () => $("set-import").click();

          try {
            const s = JSON.parse(rd.result);
            if (!s || s.version !== 1 || !s.player) throw new Error("存档格式不符");
            localStorage.setItem(St.SAVE_KEY, JSON.stringify(s));
            alert("存档导入成功，即将载入。");
